<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    入会申請管理｜ポンコツ倶楽部
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #17364d;

      background:
        linear-gradient(
          180deg,
          #dff5ff 0%,
          #eefaff 210px,
          #f8fcff 480px,
          #edf4f8 100%
        );
    }

    button {
      font-family: inherit;
    }

    .header {
      position: relative;
      overflow: hidden;

      padding: 27px 18px 39px;

      color: white;
      text-align: center;

      background:
        linear-gradient(
          145deg,
          #0b5f99 0%,
          #2793c8 55%,
          #8fd9f2 100%
        );
    }

    .header::before {
      content: "";

      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -30px;

      height: 66px;

      background: #eefaff;

      clip-path: polygon(
        0 72%,
        10% 48%,
        20% 68%,
        31% 28%,
        43% 66%,
        55% 39%,
        67% 72%,
        79% 34%,
        90% 61%,
        100% 40%,
        100% 100%,
        0 100%
      );
    }

    .header h1 {
      position: relative;
      z-index: 1;

      margin: 0;

      font-size: 25px;
    }

    .header p {
      position: relative;
      z-index: 1;

      margin: 6px 0 0;

      font-size: 13px;
      opacity: 0.92;
    }

    .container {
      width: min(
        calc(100% - 24px),
        760px
      );

      margin: 0 auto;
      padding: 18px 0 42px;
    }

    .back-link {
      display: inline-block;

      margin-bottom: 16px;

      color: #176a99;

      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .summary-card,
    .request-card,
    .loading-card,
    .empty-card,
    .error-card {
      padding: 16px;

      border:
        1px solid
        rgba(
          87,
          155,
          194,
          0.23
        );

      border-radius: 16px;

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );

      box-shadow:
        0 5px 17px
        rgba(
          34,
          91,
          125,
          0.08
        );
    }

    .summary-card {
      margin-bottom: 18px;
    }

    .summary-title {
      margin: 0;

      color: #234b66;

      font-size: 17px;
    }

    .summary-count {
      margin: 8px 0 0;

      color: #176a99;

      font-size: 30px;
      font-weight: bold;
    }

    .request-card {
      border-left:
        5px solid
        #2a95c8;
    }

    .request-card
    + .request-card {
      margin-top: 12px;
    }

    .request-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .request-name {
      margin: 0;

      color: #173d58;

      font-size: 19px;
    }

    .status-badge {
      flex-shrink: 0;

      padding: 5px 9px;

      border-radius: 20px;

      color: #996000;

      font-size: 12px;
      font-weight: bold;

      background: #fff0cf;
    }

    .request-info {
      margin: 9px 0 0;

      color: #557185;

      font-size: 14px;
      line-height: 1.6;
    }

    .request-info strong {
      color: #284f69;
    }

    .rules-box {
      margin-top: 12px;
      padding: 12px;

      border-radius: 11px;

      color: #176a70;

      font-size: 14px;
      font-weight: bold;

      background: #e6f8f5;
    }

    .button-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;

      margin-top: 15px;
    }

    .reject-button,
    .approve-button {
      padding: 12px 10px;

      border-radius: 10px;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    .reject-button {
      border:
        1px solid
        #d79a9a;

      color: #ad3f3f;

      background: white;
    }

    .approve-button {
      border: none;

      color: white;

      background:
        linear-gradient(
          135deg,
          #126da9,
          #2aa8d3
        );
    }

    .loading-card,
    .empty-card {
      color: #67889b;
      text-align: center;
    }

    .error-card {
      color: #bd3838;
      font-weight: bold;
      text-align: center;
    }

    @media (
      max-width: 520px
    ) {
      .button-row {
        grid-template-columns: 1fr;
      }

      .request-title-row {
        display: block;
      }

      .status-badge {
        display: inline-block;
        margin-top: 8px;
      }
    }
  </style>

</head>

<body>

  <header class="header">

    <h1>
      入会申請
    </h1>

    <p>
      Membership Requests
    </p>

  </header>


  <main class="container">

    <a
      class="back-link"
      href="admin.html"
    >
      ← 管理者画面へ戻る
    </a>


    <section class="summary-card">

      <h2 class="summary-title">
        承認待ち
      </h2>

      <p
        id="request-count"
        class="summary-count"
      >
        －件
      </p>

    </section>


    <div id="request-list">

      <div class="loading-card">
        入会申請を読み込んでいます...
      </div>

    </div>

  </main>


  <script src="portal-auth.js?v=4"></script>


  <script>

    const requestList =
      document.getElementById(
        "request-list"
      );

    const requestCount =
      document.getElementById(
        "request-count"
      );


    /* =====================================
       管理者確認
    ====================================== */

    const loginMember =
      getPortalMember();

    if (
      !loginMember ||
      (
        loginMember.role !==
          "admin" &&
        loginMember.role !==
          "super_admin"
      )
    ) {
      window.location.href =
        "index.html";
    }


    /* =====================================
       入会申請一覧
    ====================================== */

    loadJoinRequests();


    async function loadJoinRequests() {

      try {

        const response =
          await portalFetch(
            "/rest/v1/join_requests" +
            "?select=*" +
            "&status=eq.pending" +
            "&order=created_at.asc"
          );


        if (
          !response.ok
        ) {

          const errorText =
            await response.text();

          console.error(
            "入会申請取得エラー:",
            response.status,
            errorText
          );

          throw new Error(
            "入会申請の取得に失敗しました。"
          );
        }


        const requests =
          await response.json();


        if (
          !Array.isArray(
            requests
          )
        ) {
          throw new Error(
            "入会申請データが正しくありません。"
          );
        }


        requestCount.textContent =
          `${requests.length}件`;


        if (
          requests.length ===
          0
        ) {

          requestList.innerHTML =
            `
              <div class="empty-card">
                現在、承認待ちの入会申請はありません。
              </div>
            `;

          return;
        }


        requestList.innerHTML =
          "";


        requests.forEach(
          (request) => {

            const card =
              createRequestCard(
                request
              );

            requestList.appendChild(
              card
            );
          }
        );


      } catch (error) {

        console.error(
          error
        );

        requestCount.textContent =
          "？件";

        requestList.innerHTML =
          `
            <div class="error-card">
              入会申請を読み込めませんでした。
            </div>
          `;
      }
    }


    /* =====================================
       カード作成
    ====================================== */

    function createRequestCard(
      request
    ) {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "request-card";


      const agreedText =
        request.rules_agreed
          ? "同意済み"
          : "未同意";


      card.innerHTML =
        `
          <div class="request-title-row">

            <h2 class="request-name">
              ${escapeHtml(
                request.name ||
                ""
              )}
            </h2>

            <span class="status-badge">
              承認待ち
            </span>

          </div>


          <p class="request-info">
            <strong>
              ふりがな：
            </strong>

            ${escapeHtml(
              request.furigana ||
              ""
            )}
          </p>


          <p class="request-info">
            <strong>
              生年月日：
            </strong>

            ${escapeHtml(
              request.birth_date ||
              ""
            )}
          </p>


          <p class="request-info">
            <strong>
              電話番号：
            </strong>

            ${escapeHtml(
              request.phone ||
              ""
            )}
          </p>


          <p class="request-info">
            <strong>
              メール：
            </strong>

            ${escapeHtml(
              request.email ||
              ""
            )}
          </p>


          <p class="request-info">
            <strong>
              申請日時：
            </strong>

            ${formatDateTime(
              request.created_at
            )}
          </p>


          <div class="rules-box">
            会則：
            ${escapeHtml(
              request.rules_version ||
              "版情報なし"
            )}
            ／
            ${agreedText}
          </div>


          <div class="button-row">

  <button
    class="reject-button"
    type="button"
    data-id="${request.id}"
  >
    却下
  </button>

  <button
    class="approve-button"
    type="button"
    data-id="${request.id}"
  >
    承認へ進む
  </button>

</div>

<div
  class="approval-box"
  data-approval-box="${request.id}"
  style="
    display:none;
    margin-top:14px;
    padding:14px;
    border-radius:12px;
    background:#f3f9fc;
  "
>

  <label
    style="
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#284f69;
    "
  >
    初期パスワード
  </label>

  <input
    type="password"
    class="initial-password-input"
    data-password-input="${request.id}"
    placeholder="初期パスワードを入力"
    style="
      width:100%;
      padding:12px;
      border:1px solid #a9cadc;
      border-radius:10px;
      font-size:16px;
    "
  >

  <button
    type="button"
    class="approve-button"
    data-final-approve="${request.id}"
    style="
      width:100%;
      margin-top:10px;
    "
  >
    この内容で承認する
  </button>

</div>
        `;

        const approveButton =
  card.querySelector(
    ".approve-button"
  );

const approvalBox =
  card.querySelector(
    `[data-approval-box="${request.id}"]`
  );

const passwordInput =
  card.querySelector(
    `[data-password-input="${request.id}"]`
  );

const finalApproveButton =
  card.querySelector(
    `[data-final-approve="${request.id}"]`
  );


/* 承認画面を開く */

approveButton.addEventListener(
  "click",
  () => {

    approvalBox.style.display =
      "block";

    passwordInput.focus();
  }
);


/* 最終承認 */

finalApproveButton.addEventListener(
  "click",
  async () => {

    const password =
      passwordInput.value;


    if (
      password.length < 6
    ) {
      alert(
        "初期パスワードは6文字以上にしてください。"
      );

      passwordInput.focus();

      return;
    }


    const confirmed =
      confirm(
        `${request.name} さんを正式会員として承認しますか？`
      );


    if (!confirmed) {
      return;
    }


    const originalText =
      finalApproveButton.textContent;


    try {

      finalApproveButton.disabled =
        true;

      approveButton.disabled =
        true;

      finalApproveButton.textContent =
        "承認処理中...";


      const response =
        await portalFetch(
          "/functions/v1/rapid-service",
          {
            method:
              "POST",

            body:
              JSON.stringify({
                request_id:
                  request.id,

                password:
                  password
              })
          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error ||
          "入会承認に失敗しました。"
        );
      }


      alert(
        `${request.name} さんを正式会員として登録しました。\n\n会員ID：${result.member_id}`
      );


      await loadJoinRequests();


    } catch (error) {

      console.error(
        "入会承認エラー:",
        error
      );


      alert(
        error.message ||
        "入会承認に失敗しました。"
      );


      finalApproveButton.disabled =
        false;

      approveButton.disabled =
        false;

      finalApproveButton.textContent =
        originalText;
    }
  }
);

const rejectButton =
  card.querySelector(
    ".reject-button"
  );


/* 却下 */

rejectButton.addEventListener(
  "click",
  async () => {

    const confirmed =
      confirm(
        `${request.name} さんの入会申請を却下しますか？`
      );


    if (!confirmed) {
      return;
    }


    const originalText =
      rejectButton.textContent;


    try {

      rejectButton.disabled =
        true;

      approveButton.disabled =
        true;

      rejectButton.textContent =
        "却下処理中...";


      const response =
        await portalFetch(
          `/rest/v1/join_requests?id=eq.${request.id}`,
          {
            method:
              "PATCH",

            headers: {
              Prefer:
                "return=minimal"
            },

            body:
              JSON.stringify({
                status:
                  "rejected",

                updated_at:
                  new Date()
                    .toISOString()
              })
          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          errorText ||
          "却下処理に失敗しました。"
        );
      }


      alert(
        `${request.name} さんの入会申請を却下しました。`
      );


      await loadJoinRequests();


    } catch (error) {

      console.error(
        "入会却下エラー:",
        error
      );


      alert(
        error.message ||
        "却下処理に失敗しました。"
      );


      rejectButton.disabled =
        false;

      approveButton.disabled =
        false;

      rejectButton.textContent =
        originalText;
    }
  }
);


return card;
    }


    /* =====================================
       日時表示
    ====================================== */

    function formatDateTime(
      value
    ) {

      if (!value) {
        return "";
      }

      const date =
        new Date(
          value
        );

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return value;
      }

      return (
        `${date.getFullYear()}/` +
        `${date.getMonth() + 1}/` +
        `${date.getDate()} ` +
        `${String(
          date.getHours()
        ).padStart(
          2,
          "0"
        )}:` +
        `${String(
          date.getMinutes()
        ).padStart(
          2,
          "0"
        )}`
      );
    }


    /* =====================================
       HTMLエスケープ
    ====================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }

  </script>

</body>

</html>
