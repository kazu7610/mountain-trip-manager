<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script src="theme-manager.js"></script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    山行詳細｜ポンコツ倶楽部
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #17364d;

      background:
        linear-gradient(
          180deg,
          #dff5ff 0%,
          #eefaff 210px,
          #f8fcff 480px,
          #edf4f8 100%
        );
    }

    button {
      font-family: inherit;
    }

    .header {
      position: relative;
      overflow: hidden;

      padding: 27px 18px 39px;

      color: white;
      text-align: center;

      background:
        linear-gradient(
          145deg,
          #0b5f99 0%,
          #2793c8 55%,
          #8fd9f2 100%
        );
    }

    .header::before {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -30px;

      height: 66px;

      background: #eefaff;

      clip-path: polygon(
        0 72%,
        10% 48%,
        20% 68%,
        31% 28%,
        43% 66%,
        55% 39%,
        67% 72%,
        79% 34%,
        90% 61%,
        100% 40%,
        100% 100%,
        0 100%
      );
    }

    .header h1 {
      position: relative;
      z-index: 1;

      margin: 0;

      font-size: 25px;
    }

    .header p {
      position: relative;
      z-index: 1;

      margin: 6px 0 0;

      font-size: 13px;
      opacity: 0.92;
    }

    .container {
      width: min(
        calc(100% - 24px),
        720px
      );

      margin: 0 auto;
      padding: 18px 0 42px;
    }

    .back-link {
      display: inline-block;

      margin-bottom: 15px;

      color: #176a99;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .loading-card,
    .error-card {
      padding: 24px 16px;

      border-radius: 18px;

      text-align: center;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      box-shadow:
        0 5px 17px
        rgba(
          34,
          91,
          125,
          0.08
        );
    }

    .loading-card {
      color: #67889b;
    }

    .error-card {
      color: #bd3838;
      font-weight: bold;
    }

    .detail-card {
      overflow: hidden;

      border:
        1px solid
        rgba(
          87,
          155,
          194,
          0.23
        );

      border-radius: 18px;

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );

      box-shadow:
        0 5px 17px
        rgba(
          34,
          91,
          125,
          0.08
        );
    }

    .detail-head {
      padding: 19px 18px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #126da9,
          #35afd5
        );
    }

    .detail-area {
      margin: 0 0 6px;

      font-size: 13px;
      opacity: 0.9;
    }

    .detail-title {
      margin: 0;

      font-size: 23px;
      line-height: 1.45;
    }

    .status-badge {
      display: inline-block;

      margin-top: 11px;
      padding: 6px 10px;

      border-radius: 20px;

      color: #135f8d;
      font-size: 12px;
      font-weight: bold;

      background: #e2f5fc;
    }

    .detail-body {
      padding: 7px 18px 20px;
    }

    .detail-row {
      padding: 15px 0;

      border-bottom:
        1px solid
        #e2edf3;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      margin: 0 0 6px;

      color: #71899a;
      font-size: 12px;
      font-weight: bold;
    }

    .detail-value {
      margin: 0;

      color: #234b66;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 3px;
    }

    .member-chip {
      padding: 7px 10px;

      border-radius: 20px;

      color: #176a99;
      font-size: 13px;
      font-weight: bold;

      background: #e7f5fb;
    }

    .member-contact-button {
      border: none;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .member-contact-button:hover { filter: brightness(0.95); }
    .member-contact-button:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    #member-contact-modal {
      width: min(calc(100% - 32px), 440px);
      max-height: 85vh;
      padding: 0;
      border: 1px solid var(--theme-border, #c8dde8);
      border-radius: 18px;
      color: var(--theme-text, #17364d);
      background: var(--theme-surface, #fff);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      overflow: auto;
    }

    #member-contact-modal::backdrop { background: rgba(0, 0, 0, 0.5); }
    .member-contact-panel { padding: 24px; }
    #member-contact-title { margin: 0 0 18px; font-size: 20px; }
    #member-contact-content { line-height: 1.6; overflow-wrap: anywhere; }
    #member-contact-content dl { margin: 0; }
    .member-contact-field + .member-contact-field { margin-top: 12px; }
    .member-contact-field dt { font-size: 12px; opacity: 0.8; }
    .member-contact-field dd { margin: 3px 0 0; font-weight: bold; }
    #member-contact-content a { color: var(--theme-accent, #176a99); }
    #member-contact-close { width: 100%; margin-top: 20px; }

    html.ponkotsu-dark-mode #member-contact-modal {
      color: #f2f7f9;
      background: #243944;
      border-color: #4d6874;
    }
    html.ponkotsu-dark-mode #member-contact-content a { color: #9bdcff; }

    .outside-chip {
      color: #755800;
      background: #fff1ca;
    }

    .button-row {
      display: grid;
      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 17px;
    }

    .home-button,
    .plan-button {
      padding: 13px 9px;

      border-radius: 11px;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    .home-button {
      border:
        1px solid
        #78b8d7;

      color: #176a99;
      background: white;
    }

    .plan-button {
  border:
    1px solid
    #78b8d7;

  color: #176a99;
  background: #ffffff;
}

    .plan-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .descent-button {
  width: 100%;

  margin-top: 12px;
  padding: 14px 10px;

  border: none;
  border-radius: 12px;

  color: white;
  font-size: 16px;
  font-weight: bold;

  background: #73bfa2;

  cursor: pointer;
}

    .descent-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .request-button-row {
      display: grid;
      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 12px;
    }

    .change-request-button,
    .cancel-request-button {
      padding: 12px 10px;

      border-radius: 12px;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    .change-request-button {
      border:
        1px solid
        #78b8d7;

      color: #176a99;
      background: #ffffff;
    }

    .cancel-request-button {
      border:
        1px solid
        #e0a0a0;

      color: #a53a3a;
      background: #fff6f6;
    }

    .change-request-button:disabled,
    .cancel-request-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .descent-complete {
      margin-top: 12px;
      padding: 13px;

      border-radius: 12px;

      color: #176a70;
      font-size: 14px;
      font-weight: bold;
      text-align: center;

      background: #e6f8f5;
    }

    .trip-comment-list {
      display: grid;
      gap: 10px;
    }

    .trip-comment-item {
  position: relative;

  padding: 8px 10px;

  border-radius: 10px;

  background: #fff4d6;
}

    .trip-comment-name {
      color: #755800;
      font-size: 14px;
      font-weight: bold;
    }

   .trip-comment-message {
  margin: 3px 0 0;
  padding: 0;

  color: #4d4a3f;
  font-size: 14px;
  line-height: 1.4;
  white-space: pre-wrap;
}

.trip-comment-time {
  margin: 4px 0 0;
  padding: 0;

  color: #8a8170;
  font-size: 12px;
  line-height: 1.2;
}

/* ダークモード時のコメント */
html.ponkotsu-dark-mode .trip-comment-item {
  background: #314852;
  border: 1px solid #4d6874;
}

html.ponkotsu-dark-mode .trip-comment-name {
  color: #ffd978;
}

html.ponkotsu-dark-mode .trip-comment-message {
  color: #f2f7f9;
}

html.ponkotsu-dark-mode .trip-comment-time {
  color: #b8c9d0;
}

    .comment-delete-button {
      display: block;
      margin-top: 8px;
      margin-left: auto;
      padding: 5px 10px;

      border:
        1px solid
        #e4a0a0;

      border-radius: 8px;

      color: #a53a3a;
      font-size: 12px;
      font-weight: bold;

      background: #fffafa;

      cursor: pointer;
    }

    .comment-delete-button:hover {
      background: #fff0f0;
    }

    @media (
      max-width: 520px
    ) {
      .button-row,
      .request-button-row {
        grid-template-columns: 1fr;
      }

      .detail-title {
        font-size: 21px;
      }
    }
  .participant-comment-button {
  width: 100%;

  margin-top: 12px;
  padding: 14px 10px;

  border:
    1px solid
    #c8a96b;

  border-radius: 12px;

  color: #755800;
  font-size: 16px;
  font-weight: bold;

  background: #ffffff;

  cursor: pointer;
}

.participant-comment-button {
  width: 100%;

  margin-top: 12px;
  padding: 14px 10px;

  border:
    1px solid
    #c8a96b;

  border-radius: 12px;

  color: #755800;
  font-size: 16px;
  font-weight: bold;

  background: #ffffff;

  cursor: pointer;
}


  </style>

  <link rel="stylesheet" href="side-menu.css">
  <link rel="stylesheet" href="app-settings.css">

  <link rel="stylesheet" href="themes.css">
</head>

<body>

  <header class="header">

    <h1>
      山行詳細
    </h1>

    <p>
      Mountain Trip Details
    </p>

  </header>

  <main class="container">

    <a
      class="back-link"
      href="javascript:history.back()"
    >
      ← 一覧へ戻る
    </a>

    <div id="trip-detail">

      <div class="loading-card">
        山行情報を読み込んでいます...
      </div>

    </div>

  </main>

  <dialog id="member-contact-modal" aria-labelledby="member-contact-title">
    <div class="member-contact-panel">
      <h2 id="member-contact-title">緊急連絡先</h2>
      <div id="member-contact-content" aria-live="polite"></div>
      <button id="member-contact-close" class="home-button" type="button">閉じる</button>
    </div>
  </dialog>

  <script src="portal-auth.js?v=4"></script>
  <script src="push-notifications.js?v=4"></script>
  <script src="trip-detail.js?v=57"></script>
  <script src="side-menu.js"></script>
  <script src="app-settings.js"></script>

</body>
</html>
