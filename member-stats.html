<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    個人実績｜ポンコツ倶楽部
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #17364d;

      background:
        linear-gradient(
          180deg,
          #dff5ff 0%,
          #eefaff 210px,
          #f8fcff 480px,
          #edf4f8 100%
        );
    }

    button,
    select {
      font-family: inherit;
    }

    .container {
      width: min(
        calc(100% - 24px),
        760px
      );

      margin: 0 auto;
      padding: 24px 0 42px;
    }

   .page-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;

  margin: 0 0 2px 0;

  font-size: 26px;
}

    .page-title::before {
      content: "";

      width: 5px;
      height: 28px;

      border-radius: 10px;

      background:
        linear-gradient(
          #1282bc,
          #76cfe9
        );
    }

    .member-name {
      margin: 0 0 12px;

      text-align: center;

      color: #176a99;
      font-size: 22px;
      font-weight: bold;
    }

    .year-select {
      width: 100%;

      padding: 11px 12px;

      border:
        1px solid
        #9fc9df;

      border-radius: 10px;

      color: #17364d;
      font-size: 14px;

      background: white;
    }

    .summary-card {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 10px;

      margin-top: 12px;
    }

    .summary-item {
      padding: 17px 10px;

      border:
        1px solid
        rgba(83, 159, 200, 0.25);

      border-radius: 16px;

      text-align: center;

      background:
        rgba(255, 255, 255, 0.96);

      box-shadow:
        0 5px 16px
        rgba(34, 91, 125, 0.09);
    }

    .summary-label {
      margin: 0;

      color: #173d58;
      font-size: 14px;
      font-weight: bold;
    }

    .summary-number {
      margin: 5px 0 0;

      color: #126ca8;
      font-size: 32px;
      font-weight: bold;
    }

    .summary-number span {
      margin-left: 3px;
      font-size: 14px;
    }

    .accordion {
      margin-top: 10px;

      border:
        1px solid
        rgba(83, 159, 200, 0.25);

      border-radius: 14px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.96);

      box-shadow:
        0 4px 13px
        rgba(34, 91, 125, 0.07);
    }

    .accordion-button {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 15px;

      border: none;

      color: #173d58;
      font-size: 16px;
      font-weight: bold;
      text-align: left;

      background: transparent;

      cursor: pointer;
    }

    .accordion-arrow {
      color: #5c8da8;
      font-size: 17px;

      transition:
        transform 0.2s ease;
    }

    .accordion.open
    .accordion-arrow {
      transform:
        rotate(90deg);
    }

    .accordion-content {
      display: none;

      padding:
        0 15px 12px;
    }

    .accordion.open
    .accordion-content {
      display: block;
    }

    .stats-list {
      display: grid;
      gap: 0;
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 9px 0;

      border-bottom:
        1px solid
        #e2edf3;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-label {
      font-size: 14px;
      font-weight: bold;
    }

    .stats-value {
      color: #176a99;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .back-button {
      width: 100%;

      margin-top: 16px;
      padding: 12px;

      border:
        1px solid
        #78b8d7;

      border-radius: 12px;

      color: #176a99;
      font-size: 15px;
      font-weight: bold;

      background: white;

      cursor: pointer;
    }

    @media (
      max-width: 420px
    ) {
      .container {
        width:
          min(
            calc(100% - 18px),
            760px
          );
      }

      .page-title {
        font-size: 24px;
      }
    }
  </style>

  <link rel="stylesheet" href="side-menu.css">
  <link rel="stylesheet" href="app-settings.css">

</head>

<body>

  <main class="container">

    <h1 class="page-title">
      個人実績
    </h1>

    <p
      id="member-name"
      class="member-name"
    >
      会員名
    </p>

    <select
      id="stats-year-select"
      class="year-select"
    >
      <option value="2026">
        2026年度
      </option>
    </select>

    <section class="summary-card">

      <div class="summary-item">

        <p class="summary-label">
          山行回数
        </p>

        <p
          id="member-trip-count"
          class="summary-number"
        >
          0<span>回</span>
        </p>

      </div>

      <div class="summary-item">

        <p class="summary-label">
          入山日数
        </p>

        <p
          id="member-trip-days"
          class="summary-number"
        >
          0<span>日</span>
        </p>

      </div>

    </section>


    <section class="accordion">

      <button
        class="accordion-button"
        type="button"
      >
        <span>月別</span>
        <span class="accordion-arrow">〉</span>
      </button>

      <div class="accordion-content">

        <div
          id="monthly-stats"
          class="stats-list"
        >
          読み込み中...
        </div>

      </div>

    </section>


    <section class="accordion">

      <button
        class="accordion-button"
        type="button"
      >
        <span>形態別</span>
        <span class="accordion-arrow">〉</span>
      </button>

      <div class="accordion-content">

        <div
          id="duration-stats"
          class="stats-list"
        >
          読み込み中...
        </div>

      </div>

    </section>


    <section class="accordion">

      <button
        class="accordion-button"
        type="button"
      >
        <span>山域別</span>
        <span class="accordion-arrow">〉</span>
      </button>

      <div class="accordion-content">

        <div
          id="area-stats"
          class="stats-list"
        >
          読み込み中...
        </div>

      </div>

    </section>


    <section class="accordion">

      <button
        class="accordion-button"
        type="button"
      >
        <span>スタイル別</span>
        <span class="accordion-arrow">〉</span>
      </button>

      <div class="accordion-content">

        <div
          id="style-stats"
          class="stats-list"
        >
          読み込み中...
        </div>

      </div>

    </section>


    <button
      class="back-button"
      type="button"
      onclick="location.href='annual-stats.html'"
    >
      年間山行実績へ戻る
    </button>

    <button
  class="back-button"
  type="button"
  onclick="location.href='member-profile.html'"
>
  マイページへ戻る
</button>

  </main>


  <script src="portal-auth.js?v=4"></script>
  <script src="member-stats.js?v=1"></script>

  <script>
    document
      .querySelectorAll(
        ".accordion-button"
      )
      .forEach(
        (button) => {
          button.addEventListener(
            "click",
            () => {
              const accordion =
                button.closest(
                  ".accordion"
                );

              accordion.classList.toggle(
                "open"
              );
            }
          );
        }
      );
  </script>

  <script src="side-menu.js"></script>
  <script src="app-settings.js"></script>

</body>

</html>
