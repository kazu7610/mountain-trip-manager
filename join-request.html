<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    新規入会申請｜ポンコツ倶楽部
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #17364d;

      background:
        linear-gradient(
          180deg,
          #dff5ff 0%,
          #eefaff 210px,
          #f8fcff 480px,
          #edf4f8 100%
        );
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .header {
      position: relative;
      overflow: hidden;

      padding: 26px 18px 38px;

      color: white;
      text-align: center;

      background:
        linear-gradient(
          145deg,
          #0b5f99 0%,
          #2793c8 55%,
          #8fd9f2 100%
        );
    }

    .header::before {
      content: "";

      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -30px;

      height: 65px;

      background: #eefaff;

      clip-path: polygon(
        0 72%,
        10% 48%,
        20% 68%,
        31% 28%,
        43% 66%,
        55% 39%,
        67% 72%,
        79% 34%,
        90% 61%,
        100% 40%,
        100% 100%,
        0 100%
      );
    }

    .header h1 {
      position: relative;
      z-index: 1;

      margin: 0;

      font-size: 25px;
    }

    .header p {
      position: relative;
      z-index: 1;

      margin: 6px 0 0;

      font-size: 13px;
      opacity: 0.92;
    }

    .container {
      width: min(
        calc(100% - 24px),
        720px
      );

      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .back-link {
      display: inline-block;

      margin-bottom: 14px;

      color: #176a99;

      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .form-card {
      padding: 18px;

      border:
        1px solid
        rgba(
          87,
          155,
          194,
          0.22
        );

      border-radius: 18px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      box-shadow:
        0 5px 17px
        rgba(
          34,
          91,
          125,
          0.08
        );
    }

    .form-note {
      margin: 0 0 22px;

      color: #718a9a;

      font-size: 14px;
      line-height: 1.6;
    }

    .form-section
    + .form-section {
      margin-top: 21px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      color: #234b66;

      font-size: 15px;
      font-weight: bold;
    }

    .required {
      margin-left: 5px;

      color: #d94d4d;

      font-size: 12px;
    }

    input {
      width: 100%;

      padding: 12px;

      border:
        1px solid
        #a9cadc;

      border-radius: 11px;

      color: #17364d;

      font-size: 16px;

      background: white;
    }

    input:focus {
      outline: none;

      border-color: #2b97c7;

      box-shadow:
        0 0 0 3px
        rgba(
          43,
          151,
          199,
          0.12
        );
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;

      margin-top: 26px;
    }

    .next-button {
      width: 100%;

      padding: 14px 10px;

      border: none;
      border-radius: 12px;

      color: white;

      font-size: 15px;
      font-weight: bold;

      background:
        linear-gradient(
          135deg,
          #126da9,
          #2aa8d3
        );

      cursor: pointer;
    }

    .next-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .secondary-button {
      background:
        linear-gradient(
          135deg,
          #7895a6,
          #9eb3bf
        );
    }

    .rules-agree-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;

      margin-top: 18px;

      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
    }

    .rules-agree-label input {
      width: 20px;
      height: 20px;

      margin-top: 1px;

      flex-shrink: 0;
    }

    .message {
      display: none;

      margin-top: 18px;
      padding: 13px;

      border-radius: 11px;

      font-size: 14px;
      line-height: 1.6;
    }

    .message.error {
      display: block;

      color: #9b2f2f;
      background: #fff0f0;
      border: 1px solid #efb4b4;
    }

    .success-card {
      padding: 28px 20px;

      border:
        1px solid
        rgba(
          87,
          155,
          194,
          0.22
        );

      border-radius: 18px;

      text-align: center;

      background: white;

      box-shadow:
        0 5px 17px
        rgba(
          34,
          91,
          125,
          0.08
        );
    }

    .success-icon {
      margin-bottom: 12px;

      font-size: 46px;
    }

    .success-card h2 {
      margin: 0 0 14px;

      color: #176a99;

      font-size: 22px;
    }

    .success-card p {
      margin: 0 0 22px;

      color: #627c8c;

      font-size: 14px;
      line-height: 1.7;
    }

    @media (
      min-width: 560px
    ) {
      .button-row.two-buttons {
        grid-template-columns:
          1fr 1fr;
      }
    }
  </style>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="theme-color"
    content="#0b5f99"
  >

</head>

<body>

  <header class="header">

    <h1>
      新規入会申請
    </h1>

    <p>
      Ponkotsu Club Membership
    </p>

  </header>

  <main class="container">

    <a
      id="login-back-link"
      class="back-link"
      href="login.html"
    >
      ← ログイン画面へ戻る
    </a>


    <!-- =====================================
         STEP 1
         入会情報入力
    ====================================== -->
    <form
      id="join-request-form"
      class="form-card"
    >

      <p class="form-note">
        ポンコツ倶楽部への入会申請に必要な情報を入力してください。
      </p>


      <section class="form-section">

        <label
          class="form-label"
          for="join-name"
        >
          氏名
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-name"
          name="name"
          type="text"
          maxlength="50"
          autocomplete="name"
          placeholder="例：鈴木 一郎"
          required
        >

      </section>


      <section class="form-section">

        <label
          class="form-label"
          for="join-kana"
        >
          ふりがな
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-kana"
          name="kana"
          type="text"
          maxlength="50"
          placeholder="例：すずき いちろう"
          required
        >

      </section>


      <section class="form-section">

        <label
          class="form-label"
          for="join-birth-date"
        >
          生年月日
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-birth-date"
          name="birth-date"
          type="date"
          required
        >

      </section>


      <section class="form-section">

        <label
          class="form-label"
          for="join-phone"
        >
          電話番号
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-phone"
          name="phone"
          type="tel"
          maxlength="20"
          autocomplete="tel"
          placeholder="例：090-1234-5678"
          required
        >

      </section>


      <section class="form-section">

        <label
          class="form-label"
          for="join-email"
        >
          メールアドレス
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-email"
          name="email"
          type="email"
          maxlength="100"
          autocomplete="email"
          placeholder="例：example@email.com"
          required
        >

      </section>


      <div class="button-row">

        <button
          id="join-next-button"
          class="next-button"
          type="button"
        >
          次へ
        </button>

      </div>

    </form>


    <!-- =====================================
         STEP 2
         会則確認
    ====================================== -->
    <section
      id="join-rules-step"
      class="form-card"
      style="
        display:none;
        margin-top:16px;
      "
    >

      <h2 class="form-label">
        会則の確認
      </h2>

      <p class="form-note">
        入会申請の前に、ポンコツ倶楽部の会則をご確認ください。
      </p>


      <div id="rules-pdf-area">

        <iframe
          src="club-rules.pdf"
          title="ポンコツ倶楽部 会則"
          style="
            width:100%;
            height:520px;
            border:1px solid #c5dce8;
            border-radius:12px;
            background:white;
          "
        >
        </iframe>

      </div>


      <label
        class="rules-agree-label"
      >

        <input
          id="rules-agree"
          type="checkbox"
        >

        <span>
          会則を確認し、内容に同意します。
        </span>

      </label>


      <div
        class="button-row two-buttons"
      >

        <button
          id="join-back-button"
          class="
            next-button
            secondary-button
          "
          type="button"
        >
          入力画面へ戻る
        </button>

        <button
          id="join-submit-button"
          class="next-button"
          type="button"
          disabled
        >
          入会申請する
        </button>

      </div>


      <div
        id="join-message"
        class="message"
      ></div>

    </section>


    <!-- =====================================
         STEP 3
         申請完了
    ====================================== -->
    <section
      id="join-complete-step"
      class="success-card"
      style="display:none;"
    >

      <div class="success-icon">
        ✅
      </div>

      <h2>
        入会申請を受け付けました
      </h2>

      <p>
        申請内容を確認後、管理者からご連絡します。<br>
        承認されるまでしばらくお待ちください。
      </p>

      <button
        id="complete-login-button"
        class="next-button"
        type="button"
      >
        ログイン画面へ戻る
      </button>

    </section>

  </main>


  <!-- =====================================
       ポンコツ倶楽部
       Supabase共通接続
  ====================================== -->
  <script src="portal-auth.js?v=4"></script>


  <script>

    /* =====================================
       会則バージョン
    ====================================== */

    const RULES_VERSION =
      "2026年度版";


    /* =====================================
       要素取得
    ====================================== */

    const joinForm =
      document.getElementById(
        "join-request-form"
      );

    const rulesStep =
      document.getElementById(
        "join-rules-step"
      );

    const completeStep =
      document.getElementById(
        "join-complete-step"
      );

    const nextButton =
      document.getElementById(
        "join-next-button"
      );

    const backButton =
      document.getElementById(
        "join-back-button"
      );

    const rulesAgree =
      document.getElementById(
        "rules-agree"
      );

    const joinSubmitButton =
      document.getElementById(
        "join-submit-button"
      );

    const joinMessage =
      document.getElementById(
        "join-message"
      );

    const loginBackLink =
      document.getElementById(
        "login-back-link"
      );

    const completeLoginButton =
      document.getElementById(
        "complete-login-button"
      );


    /* =====================================
       入力画面 → 会則画面
    ====================================== */

    nextButton.addEventListener(
      "click",
      () => {

        if (
          !joinForm.reportValidity()
        ) {
          return;
        }

        clearMessage();

        joinForm.style.display =
          "none";

        rulesStep.style.display =
          "block";

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    );


    /* =====================================
       会則画面 → 入力画面
    ====================================== */

    backButton.addEventListener(
      "click",
      () => {

        clearMessage();

        rulesStep.style.display =
          "none";

        joinForm.style.display =
          "block";

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    );


    /* =====================================
       会則同意チェック
    ====================================== */

    rulesAgree.addEventListener(
      "change",
      () => {

        joinSubmitButton.disabled =
          !rulesAgree.checked;
      }
    );


    /* =====================================
       入会申請
    ====================================== */

    joinSubmitButton.addEventListener(
      "click",
      async () => {

        if (
          !rulesAgree.checked
        ) {
          showError(
            "会則への同意が必要です。"
          );

          return;
        }

        if (
          !joinForm.reportValidity()
        ) {
          showError(
            "入力内容を確認してください。"
          );

          return;
        }


        const name =
          document
            .getElementById(
              "join-name"
            )
            .value
            .trim();

        const furigana =
          document
            .getElementById(
              "join-kana"
            )
            .value
            .trim();

        const birthDate =
          document
            .getElementById(
              "join-birth-date"
            )
            .value;

        const phone =
          document
            .getElementById(
              "join-phone"
            )
            .value
            .trim();

        const email =
          document
            .getElementById(
              "join-email"
            )
            .value
            .trim();


        if (
          !name ||
          !furigana ||
          !birthDate ||
          !phone ||
          !email
        ) {
          showError(
            "必須項目をすべて入力してください。"
          );

          return;
        }


        const originalText =
          joinSubmitButton.textContent;


        try {

          clearMessage();

          joinSubmitButton.disabled =
            true;

          backButton.disabled =
            true;

          joinSubmitButton.textContent =
            "送信中...";


          const requestData = {
            name:
              name,

            furigana:
              furigana,

            birth_date:
              birthDate,

            phone:
              phone,

            email:
              email,

            rules_agreed:
              true,

            rules_agreed_at:
              new Date()
                .toISOString(),

            rules_version:
              RULES_VERSION,

            status:
              "pending"
          };


          const response =
            await portalFetch(
              "/rest/v1/join_requests",
              {
                method:
                  "POST",

                headers: {
                  Prefer:
                    "return=minimal"
                },

                body:
                  JSON.stringify(
                    requestData
                  )
              }
            );


          if (
            !response.ok
          ) {

            const errorText =
              await response.text();

            console.error(
              "入会申請保存エラー:",
              response.status,
              errorText
            );

            throw new Error(
              "申請データの保存に失敗しました。"
            );
          }


          rulesStep.style.display =
            "none";

          completeStep.style.display =
            "block";

          loginBackLink.style.display =
            "none";


          joinForm.reset();

          rulesAgree.checked =
            false;


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });


        } catch (error) {

          console.error(
            "入会申請エラー:",
            error
          );

          showError(
            "入会申請を送信できませんでした。時間をおいて、もう一度お試しください。"
          );

          joinSubmitButton.disabled =
            !rulesAgree.checked;

          backButton.disabled =
            false;

          joinSubmitButton.textContent =
            originalText;
        }
      }
    );


    /* =====================================
       完了 → ログイン画面
    ====================================== */

    completeLoginButton.addEventListener(
      "click",
      () => {

        window.location.href =
          "login.html";
      }
    );


    /* =====================================
       エラー表示
    ====================================== */

    function showError(
      message
    ) {

      joinMessage.textContent =
        message;

      joinMessage.className =
        "message error";
    }


    /* =====================================
       メッセージ消去
    ====================================== */

    function clearMessage() {

      joinMessage.textContent =
        "";

      joinMessage.className =
        "message";
    }

  </script>

</body>

</html>
