<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    新規入会申請｜ポンコツ倶楽部
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #17364d;

      background:
        linear-gradient(
          180deg,
          #dff5ff 0%,
          #eefaff 210px,
          #f8fcff 480px,
          #edf4f8 100%
        );
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .header {
      position: relative;
      overflow: hidden;

      padding: 26px 18px 38px;

      color: white;
      text-align: center;

      background:
        linear-gradient(
          145deg,
          #0b5f99 0%,
          #2793c8 55%,
          #8fd9f2 100%
        );
    }

    .header::before {
      content: "";

      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -30px;

      height: 65px;

      background: #eefaff;

      clip-path: polygon(
        0 72%,
        10% 48%,
        20% 68%,
        31% 28%,
        43% 66%,
        55% 39%,
        67% 72%,
        79% 34%,
        90% 61%,
        100% 40%,
        100% 100%,
        0 100%
      );
    }

    .header h1 {
      position: relative;
      z-index: 1;

      margin: 0;

      font-size: 25px;
    }

    .header p {
      position: relative;
      z-index: 1;

      margin: 6px 0 0;

      font-size: 13px;
      opacity: 0.92;
    }

    .container {
      width: min(
        calc(100% - 24px),
        720px
      );

      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .back-link {
      display: inline-block;

      margin-bottom: 14px;

      color: #176a99;

      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .form-card {
      padding: 18px;

      border:
        1px solid
        rgba(
          87,
          155,
          194,
          0.22
        );

      border-radius: 18px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      box-shadow:
        0 5px 17px
        rgba(
          34,
          91,
          125,
          0.08
        );
    }

    .form-note {
      margin:
        0 0 22px;

      color: #718a9a;

      font-size: 14px;
      line-height: 1.6;
    }

    .form-section
    + .form-section {
      margin-top: 21px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      color: #234b66;

      font-size: 15px;
      font-weight: bold;
    }

    .required {
      margin-left: 5px;

      color: #d94d4d;

      font-size: 12px;
    }

    input {
      width: 100%;

      padding: 12px;

      border:
        1px solid
        #a9cadc;

      border-radius: 11px;

      color: #17364d;

      font-size: 16px;

      background: white;
    }

    input:focus {
      outline: none;

      border-color: #2b97c7;

      box-shadow:
        0 0 0 3px
        rgba(
          43,
          151,
          199,
          0.12
        );
    }

    .button-row {
      display: grid;

      grid-template-columns:
        1fr;

      gap: 10px;

      margin-top: 26px;
    }

    .next-button {
      width: 100%;

      padding: 14px 10px;

      border: none;
      border-radius: 12px;

      color: white;

      font-size: 15px;
      font-weight: bold;

      background:
        linear-gradient(
          135deg,
          #126da9,
          #2aa8d3
        );

      cursor: pointer;
    }
  </style>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="theme-color"
    content="#0b5f99"
  >

</head>

<body>

  <header class="header">

    <h1>
      新規入会申請
    </h1>

    <p>
      Ponkotsu Club Membership
    </p>

  </header>

  <main class="container">

    <a
      class="back-link"
      href="login.html"
    >
      ← ログイン画面へ戻る
    </a>

    <form
      id="join-request-form"
      class="form-card"
    >

      <p class="form-note">
        ポンコツ倶楽部への入会申請に必要な情報を入力してください。
      </p>

      <section class="form-section">

        <label
          class="form-label"
          for="join-name"
        >
          氏名
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-name"
          name="name"
          type="text"
          maxlength="50"
          autocomplete="name"
          placeholder="例：鈴木 一郎"
          required
        >

      </section>

      <section class="form-section">

        <label
          class="form-label"
          for="join-kana"
        >
          ふりがな
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-kana"
          name="kana"
          type="text"
          maxlength="50"
          placeholder="例：すずき いちろう"
          required
        >

      </section>

      <section class="form-section">

        <label
          class="form-label"
          for="join-birth-date"
        >
          生年月日
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-birth-date"
          name="birth-date"
          type="date"
          required
        >

      </section>

      <section class="form-section">

        <label
          class="form-label"
          for="join-phone"
        >
          電話番号
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-phone"
          name="phone"
          type="tel"
          maxlength="20"
          autocomplete="tel"
          placeholder="例：090-1234-5678"
          required
        >

      </section>

      <section class="form-section">

        <label
          class="form-label"
          for="join-email"
        >
          メールアドレス
          <span class="required">
            必須
          </span>
        </label>

        <input
          id="join-email"
          name="email"
          type="email"
          maxlength="100"
          autocomplete="email"
          placeholder="例：example@email.com"
          required
        >

      </section>

      <div class="button-row">

        <button
          id="join-next-button"
          class="next-button"
          type="button"
        >
          次へ
        </button>

      </div>

    </form>

  <section
  id="join-rules-step"
  class="form-card"
  style="display:none; margin-top:16px;"
>

  <h2 class="form-label">
    会則の確認
  </h2>

  <p class="form-note">
    入会申請の前に、ポンコツ倶楽部の会則をご確認ください。
  </p>

 <div id="rules-pdf-area">

  <iframe
    src="club-rules.pdf"
    title="ポンコツ倶楽部 会則"
    style="
      width:100%;
      height:520px;
      border:1px solid #c5dce8;
      border-radius:12px;
      background:white;
    "
  >
  </iframe>

</div>

  <label
    style="
      display:flex;
      align-items:flex-start;
      gap:10px;
      margin-top:18px;
      font-size:14px;
      font-weight:bold;
      line-height:1.5;
    "
  >

    <input
      id="rules-agree"
      type="checkbox"
      style="
        width:20px;
        height:20px;
        margin-top:1px;
      "
    >

    <span>
      会則を確認し、内容に同意します。
    </span>

  </label>

  <div class="button-row">

    <button
      id="join-back-button"
      class="next-button"
      type="button"
    >
      入力画面へ戻る
    </button>

    <button
      id="join-submit-button"
      class="next-button"
      type="button"
      disabled
    >
      入会申請する
    </button>

  </div>

</section>  

  </main>

</body>

<script>
  const joinForm =
    document.getElementById(
      "join-request-form"
    );

  const rulesStep =
    document.getElementById(
      "join-rules-step"
    );

  const nextButton =
    document.getElementById(
      "join-next-button"
    );

  const backButton =
    document.getElementById(
      "join-back-button"
    );

  nextButton.addEventListener(
    "click",
    () => {
      if (!joinForm.reportValidity()) {
        return;
      }

      joinForm.style.display =
        "none";

      rulesStep.style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  );

  backButton.addEventListener(
    "click",
    () => {
      rulesStep.style.display =
        "none";

      joinForm.style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  );
</script>

</html>
