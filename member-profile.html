<html lang="ja">

    }

    .title {

      font-weight: bold;
      color: #1d648b;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #3e6479;
    }

    input,
    select,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #b7d1df;
      border-radius: 10px;
      font-size: 16px;
      background: #ffffff;

    textarea {

      resize: vertical;
    }

    }

      color: #5a6e79;

      font-size: 17px;
      font-weight: bold;
      color: #246b92;
    }

      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 15px;
    }

    .checkbox-row input {
      width: auto;
      transform: scale(1.2);
    }

    .required {
      color: #d74c4c;
      margin-left: 4px;
    }

    .save-button {
      width: 100%;
      margin-top: 24px;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      background:
        linear-gradient(
          135deg,
          #126da9,
          #2aa8d3
        );
      cursor: pointer;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .loading {
      padding: 30px 10px;
      text-align: center;
      color: #668898;
    }

    .error {
      padding: 16px;
      border-radius: 12px;
      background: #fff1f1;
      color: #a03a3a;
    }

</head>

  会員情報

<script src="portal-auth.js?v=4"></script>

<script>

  const content =
    document.getElementById(
      "content"
    );


  const loginMember =
    getPortalMember();


  if (
    !loginMember ||
    !loginMember.id
  ) {

    window.location.href =
      "login.html";

  } else {

    loadMemberProfile();

  }


  async function loadMemberProfile() {

    try {

      const response =
        await portalFetch(
          "/rest/v1/members" +
          "?select=" +
          "id,name,gender,blood_type,birth_date," +
          "mobile_phone,home_phone,postal_code,address," +
          "emergency_name,emergency_relation,emergency_phone," +
          "insurance,insurance_company,insurance_policy_number," +
          "insurance_expiry_date,insurance_note,profile_completed" +
          `&id=eq.${loginMember.id}`
        );


      if (!response.ok) {

        throw new Error(
          "会員情報を取得できませんでした。"
        );
      }


      const data =
        await response.json();


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        throw new Error(
          "会員情報が見つかりません。"
        );
      }


      renderProfile(
        data[0]
      );


    } catch (error) {

      console.error(
        "会員情報取得エラー:",
        error
      );


      content.innerHTML = `
        <div class="error">
          ${
            error.message ||
            "会員情報の読み込みに失敗しました。"
          }
        </div>
      `;
    }
  }

async function changePassword() {

  const currentPasswordInput =
    document.getElementById(
      "current-password"
    );

  const newPasswordInput =
    document.getElementById(
      "new-password"
    );

  const newPasswordConfirmInput =
    document.getElementById(
      "new-password-confirm"
    );

  const changePasswordButton =
    document.getElementById(
      "change-password-button"
    );


  const currentPassword =
    currentPasswordInput.value;

  const newPassword =
    newPasswordInput.value;

  const newPasswordConfirm =
    newPasswordConfirmInput.value;


  if (!currentPassword) {

    alert(
      "現在のパスワードを入力してください。"
    );

    currentPasswordInput.focus();

    return;
  }


  if (
    newPassword.length < 6
  ) {

    alert(
      "新しいパスワードは6文字以上にしてください。"
    );

    newPasswordInput.focus();

    return;
  }


  if (
    newPassword !==
    newPasswordConfirm
  ) {

    alert(
      "新しいパスワードが一致していません。"
    );

    newPasswordConfirmInput.focus();

    return;
  }


  if (
    currentPassword ===
    newPassword
  ) {

    alert(
      "現在のパスワードとは違うパスワードを設定してください。"
    );

    newPasswordInput.focus();

    return;
  }


  const confirmed =
    confirm(
      "パスワードを変更しますか？"
    );


  if (!confirmed) {
    return;
  }


  const originalText =
    changePasswordButton.textContent;


  try {

    changePasswordButton.disabled =
      true;

    changePasswordButton.textContent =
      "確認中...";


    const email =
      `member-${loginMember.id}` +
      "@ponkotsu-club.local";


    const loginResponse =
      await fetch(
        `${SUPABASE_URL}` +
        "/auth/v1/token" +
        "?grant_type=password",
        {
          method:
            "POST",

          headers: {
            apikey:
              SUPABASE_KEY,

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              email:
                email,

              password:
                currentPassword
            })
        }
      );


    const loginResult =
      await loginResponse.json();


    if (!loginResponse.ok) {

      alert(
        "現在のパスワードが違います。"
      );

      currentPasswordInput.focus();

      return;
    }


    changePasswordButton.textContent =
      "変更中...";


    const updateResponse =
      await fetch(
        `${SUPABASE_URL}` +
        "/auth/v1/user",
        {
          method:
            "PUT",

          headers: {
            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${loginResult.access_token}`,

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              password:
                newPassword
            })
        }
      );


    const updateResult =
      await updateResponse.json();


    if (!updateResponse.ok) {

      throw new Error(
        updateResult.message ||
        updateResult.msg ||
        "パスワードを変更できませんでした。"
      );
    }


    const newSession = {

      access_token:
        loginResult.access_token,

      refresh_token:
        loginResult.refresh_token,

      expires_in:
        loginResult.expires_in,

      expires_at:
        Math.floor(
          Date.now() / 1000
        ) +
        Number(
          loginResult.expires_in ||
          3600
        ),

      user:
        loginResult.user
    };


    localStorage.setItem(
      "ponkotsu_session",
      JSON.stringify(
        newSession
      )
    );


    currentPasswordInput.value =
      "";

    newPasswordInput.value =
      "";

    newPasswordConfirmInput.value =
      "";


    alert(
      "パスワードを変更しました。"
    );


  } catch (error) {

    console.error(
      "パスワード変更エラー:",
      error
    );


    alert(
      error.message ||
      "パスワードを変更できませんでした。"
    );


  } finally {

    changePasswordButton.disabled =
      false;

    changePasswordButton.textContent =
      originalText;
  }
}

  }

      insuranceInput.value.trim();


    if (
      insuranceNone.checked
    ) {

      insurance =
        "未加入";

    } else if (!insurance) {

      alert(
        "山岳保険名を入力するか、未加入にチェックしてください。"
      );

      return;
    }


    const confirmed =
      confirm(
        "この内容で会員情報を保存しますか？"
      );


    if (!confirmed) {
      return;
    }


    const originalText =
      saveButton.textContent;


    try {

      saveButton.disabled =
        true;

      saveButton.textContent =
        "保存中...";


      const response =
        await portalFetch(
          `/rest/v1/members?id=eq.${loginMember.id}`,
          {
            method:
              "PATCH",

            headers: {
              Prefer:
                "return=minimal"
            },

            body:
              JSON.stringify({
                gender:
                  gender,

                blood_type:
                  bloodType,

                birth_date:
                  birthDate,

                mobile_phone:
                  mobilePhone,

                home_phone:
                  homePhone || null,

                postal_code:
                  postalCode || null,

                address:
                  address,

                emergency_name:
                  emergencyName,

                emergency_relation:
                  emergencyRelation,

                emergency_phone:
                  emergencyPhone,

                insurance:
                  insurance,

                insurance_company:
  insuranceCompany || null,

insurance_policy_number:
  insurancePolicyNumber || null,

insurance_expiry_date:
  insuranceExpiryDate || null,

insurance_note:
  insuranceNote || null,  

                profile_completed:
                  true
              })
          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          errorText ||
          "会員情報の保存に失敗しました。"
        );
      }


      alert(
        "会員情報を保存しました。"
      );
    
    const storedMember =
  getPortalMember();


if (storedMember) {

  storedMember.profileCompleted =
    true;


  localStorage.setItem(
    "ponkotsu_member",
    JSON.stringify(
      storedMember
    )
  );
}

      window.location.href =
        "index.html";


    } catch (error) {

      console.error(
        "会員情報保存エラー:",
        error
      );


      alert(
        error.message ||
        "会員情報の保存に失敗しました。"
      );


      saveButton.disabled =
        false;

      saveButton.textContent =
        originalText;
    }
  }


  function calculateAge(
    birthDate
  ) {

    if (!birthDate) {
      return "-";
    }


    const parts =
      birthDate.split(
        "-"
      );


    if (
      parts.length !== 3
    ) {
      return "-";
    }


    const birthYear =
      Number(parts[0]);

    const birthMonth =
      Number(parts[1]);

    const birthDay =
      Number(parts[2]);


    const today =
      new Date();


    let age =
      today.getFullYear() -
      birthYear;


    const currentMonth =
      today.getMonth() + 1;

    const currentDay =
      today.getDate();


    if (
      currentMonth < birthMonth ||
      (
        currentMonth === birthMonth &&
        currentDay < birthDay
      )
    ) {

      age--;
    }


    return `${age}歳`;
  }


  function escapeHtml(
    value
  ) {

    return String(
      value
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }
